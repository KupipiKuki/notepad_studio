name: Playwright Tests
on:
  push:
    branches: [ main, master, wp/phase1 ]
  pull_request:
    branches: [ main, master, wp/phase1 ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    # R04: install only the validated browser matrix (the committed spec is
    # scoped to chromium + firefox; webkit is not claimed as covered).
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium firefox
    # R04: run the committed remediation suite, not the upstream example spec
    # (which depends on external network sites). The spec resolves the app
    # file relative to the repository, so this is runnable on ubuntu-latest.
    - name: Run Playwright tests
      run: npx playwright test tests/phase1-save-recovery.spec.js --project=chromium --project=firefox
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
